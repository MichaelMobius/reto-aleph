<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<main class="shell">
<header><div class="brand">RETO ALEPH // COMEDIA</div><div class="ring">92…100 // TERCER ESTRATO</div></header>
<section class="card" id="app">
  <div class="eyebrow">GATE</div><h1 class="level">?</h1>
  <h2 class="title">91 cerró un espejo. No cerró la arquitectura.</h2>
  <p class="lead">Esta capa solo aparece después de atravesar CODEX.</p>
</section>
<footer>ORDEN / AZAR / TOTALIDAD // NO CONFUNDAS PATRÓN CON EVIDENCIA</footer>
</main>
<script>
const C=[{"n":92,"title":"Tre cantiche","family":"STRUTTURA","lead":"La obra está dividida en tres grandes regiones narrativas. No busques todavía sus nombres: cuenta la arquitectura mayor.","data":"INFERNO / PURGATORIO / PARADISO","mode":"digits","source":"https://dante.princeton.edu/cgi-bin/dante/DispToynbeeByTitOrId.pl?INP_ID=212131","hint":"Cantica es una de las grandes divisiones de la Comedia.","hash":"4e07408562bedb8b60ce05c1decfe3ad16b72230967e01f640b7e4729b49fce","proofHash":"401d5291cb2d13fc05025c96996e0ccc1dc35c41508b70f1cef701f94645d25b","markMask":31},{"n":93,"title":"Terza rima","family":"FORMA","lead":"Reconoce el mecanismo de encadenamiento. La rima central de una terzina reaparece como borde de la siguiente.","data":"ABA  BCB  CDC  DED  ...","mode":"text","source":"https://poets.org/glossary/terza-rima","hint":"No respondas con las letras del patrón; identifica la forma.","hash":"7fb8f6526dbdb69dfa4f42065bd5614a7cd45d0f381dacebdd17e37b8efab265","proofHash":"1cac8806e809d433fcf712ac18d2e7cc981b75cf0621807981d5ea0d24725c94","markMask":224},{"n":94,"title":"Endecasillabo","family":"MISURA","lead":"La unidad métrica de la Comedia recibe un nombre que literalmente señala su medida. ¿Cuántas sílabas tiene el verso canónico?","data":"ENDECA / SYLLABA / ?","mode":"digits","source":"https://poets.org/glossary/terza-rima","hint":"Hendecasyllabic = eleven-syllable.","hash":"4fc82b26aecb47d2868c4efbe3581732a3e7cbcc6c2efb32062c08170a05eeb8","proofHash":"b566d052e6729aa0845cc960ee11748d8cd789a041b0e2f43e4fb94303b4dd82","markMask":9},{"n":95,"title":"Inferno","family":"GEOMETRIA","lead":"Desciende por la topología del Infierno de Dante. ¿Cuántos círculos principales organizan la caída?","data":"DESCENT / I → ?","mode":"digits","source":"https://worldofdante.org/","hint":"El vestíbulo no se cuenta como uno de los círculos.","hash":"19581e27de7ced00ff1ce50b2047e7a567c76b1cbaebabe5ef03f7c3017bb5b7","proofHash":"52ad8a81cd4716759a3ce1248efc892b48cea36a968eae9fff6915233cccd55c","markMask":152},{"n":96,"title":"Purgatorio","family":"GEOMETRIA","lead":"Ahora asciende. Considera el Purgatorio propio, no el Ante-Purgatorio ni el Paraíso Terrenal. ¿Cuántas terrazas concéntricas hay?","data":"ASCENT / I → ?","mode":"digits","source":"https://dante.princeton.edu/cgi-bin/dante/DispToynbeeByTitOrId.pl?INP_ID=214720&SMALL=0","hint":"Cada terraza corresponde a uno de los siete pecados capitales.","hash":"7902699be42c8a8e46fbbb4501726517e86b22c56a189f7625a6da49081b2451","proofHash":"261bb4cf46d2ad6926a2882909d249c87f6cc998d0c9b2053581fc2c38977245","markMask":7},{"n":97,"title":"Paradiso","family":"COSMOLOGIA","lead":"La geometría vuelve a ser concéntrica, pero ya no descendente. ¿Cuántas esferas celestes atraviesa Dante antes del Empíreo?","data":"SPHERES / I → ? / EMPYREAN","mode":"digits","source":"https://worldofdante.org/","hint":"Cuenta las nueve esferas del modelo cosmológico del poema; el Empíreo queda más allá.","hash":"19581e27de7ced00ff1ce50b2047e7a567c76b1cbaebabe5ef03f7c3017bb5b7","proofHash":"f7caac4f99f029e797e9ae308cd6138dadebdc38deba40ac1cf5d6406bc8aab7","markMask":16},{"n":98,"title":"Canti","family":"ARITMETICA","lead":"Cuenta los cantos tal como aparecen en cada cantica. El primer reino incluye además el canto introductorio general. Escribe las tres cantidades en orden.","data":"INFERNO = ?\nPURGATORIO = ?\nPARADISO = ?","mode":"numseq","source":"https://dante.princeton.edu/cgi-bin/dante/DispToynbeeByTitOrId.pl?INP_ID=212131","hint":"33 + un canto introductorio en la primera cantica.","hash":"a9a12549d919028626c7ba13daea2fa9fe5231fbcd58d2ca2559ab718ac723b6","proofHash":"fbcd9a15db4dac507e8d235bf69eea10b7aaf4189cff364a47adb86c8382c32d","markMask":32},{"n":99,"title":"Quadrato","family":"ARITMETICA","lead":"La asimetría 34/33/33 cierra una cifra perfectamente redonda. Calcula el total y obsérvalo también como 10².","data":"34 + 33 + 33 = ?\n10² = ?","mode":"digits","source":"https://dante.princeton.edu/cgi-bin/dante/DispToynbeeByTitOrId.pl?INP_ID=212131","hint":"Las dos expresiones dan el mismo número. Escribe solo ese resultado común.","hash":"ad57366865126e55649ecb23ae1d48887544976efea46a48eb5d85a6eeb4d306","proofHash":"4e9178e5ec1cd07301cbd3ea2138635aa8291f03d4860f9005f25a2fac8927e8","markMask":89}];
const COMMEDIA_HASH='750bdc8366b87c673ecf08e6c56dc8470aedff711e6682d4d51295f37fc175ff';
const DANTE_HASH='9d26ce932fdda329fa36b5f930657982d7c41ae4399b64ada90f821b497a56fd', ALEPH_HASH='7c3a1b97b4ee5b713da52693016de9785ebe7534fed2fcc5757346dae68ba0f0';
const FLAG_C=[114,96,114,124,113,87,126,99,104,118,125,115,112,106,113,46,110,109,99,96,115,96,124,119,109,125,76];
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function isOpen(){try{const p=localStorage.getItem('aleph_comedia_open')||'';return /^[0-9a-f]{64}$/.test(p)&&await sha(p)==='cf81408b35b8db117a5259fc37ec46de36f6be2103c356dcc9523826d7baf6eb'}catch(e){return false}}
function canon(c,s){s=(s||'').trim().toUpperCase();if(c.mode==='numseq')return(s.match(/\d+/g)||[]).join(',');if(c.mode==='digits')return(s.match(/\d+/g)||[]).join('');return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'')}
async function readMark(c){try{const proof=localStorage.getItem('aleph_comedia_'+c.n)||'';if(!/^[0-9a-f]{64}$/.test(proof)||await sha(proof)!==c.proofHash)return null;return String.fromCharCode(c.markMask ^ parseInt(proof.slice(0,2),16))}catch(e){return null}}
async function status(){let s='';for(const c of C)s+=(await readMark(c))||'?';return s}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function scene(n){window.dispatchEvent(new CustomEvent('dante-scene',{detail:{n}}))}
async function renderMap(){if(!await isOpen())return;let solved=await status();let html=`<div class="eyebrow">COMEDIA::OPEN</div><h1 class="level">92–100</h1><h2 class="title">La arquitectura también puede cifrar</h2><p class="lead">92–99 son no lineales. Aquí no buscas una contraseña escondida: buscas relaciones verificables entre forma, número y espacio.</p><div class="terminal">structure=${solved.replace(/\?/g,'·')}\nsolved=${[...solved].filter(x=>x!=='?').length}/8</div><div class="dante-map">`;for(const c of C){let done=(await readMark(c))?' ✓':'';html+=`<button class="ringcard codex-node dante-node" onclick="openChallenge(${c.n})"><b>${c.n}${done}</b><span>${c.title}</span><small>${c.family}</small></button>`}html+=`</div><div class="convergence"><div class="eyebrow">100</div><h2>COMEDIA</h2><p>Cuando las ocho piezas puedan leerse como una palabra, intenta separar evidencia histórica de arquitectura construida.</p><button onclick="open100()">INTENTAR ESTACIÓN 100</button></div>`;app.innerHTML=html;scene(92)}
function openChallenge(n){const c=C.find(x=>x.n===n);if(!c)return;app.innerHTML=`<div class="eyebrow">COMEDIA::${c.family}</div><h1 class="level">${n}</h1><h2 class="title">${c.title}</h2><p class="lead">${c.lead}</p><div class="terminal">${esc(c.data)}</div><div class="row"><label class="sr-only" for="ans">Respuesta del reto ${n}</label><input id="ans" autocomplete="off" placeholder="respuesta"><button onclick="solve(${n})">VERIFICAR</button></div><div id="result" class="result"></div><details class="hint"><summary>Pista</summary><p>${c.hint}</p></details><div class="next"><button class="secondary" onclick="renderMap()">VOLVER A COMEDIA</button></div>`;scene(n);window.scrollTo(0,0)}
async function solve(n){const c=C.find(x=>x.n===n),w=canon(c,ans.value);if(await sha(w)!==c.hash){result.innerHTML='<span class="bad">La estructura no coincide con la evidencia.</span>';return}const proof=await sha(`COMMEDIA:${n}:${w}`);try{localStorage.setItem('aleph_comedia_'+n,proof)}catch(e){}const mark=String.fromCharCode(c.markMask ^ parseInt(proof.slice(0,2),16));result.innerHTML=`<div class="ok">COMEDIA::${n} RESUELTO // marca=${mark}</div><p class="lead">Comprueba la referencia, no solo la respuesta.</p><div class="external"><a href="${c.source}" target="_blank" rel="noopener">FUENTE / VERIFICAR ↗</a></div>`}
async function open100(){const s=await status();if(await sha(s)!==COMMEDIA_HASH){const k=[...s].filter(x=>x!=='?').length;app.innerHTML=`<div class="eyebrow">COMEDIA::100</div><h1 class="level">100</h1><h2 class="title">La palabra aún no está completa</h2><div class="terminal">92…99 = ${k}/8\n${s.replace(/\?/g,'·')}</div><p class="lead">Las ocho marcas forman el nombre que Dante dio a su poema.</p><button onclick="renderMap()">VOLVER</button>`;return}app.innerHTML=`<div class="eyebrow">COMEDIA::100 // EVIDENCE GATE</div><h1 class="level">100</h1><h2 class="title">No toda coincidencia es una clave</h2><p class="lead">Clasifica por procedencia dentro de este ejercicio. Un mismo número puede aparecer en más de un contexto; aquí importa dónde fue documentado o introducido como evidencia.</p><div class="terminal">MIXED SET = 3 / 7 / 9 / 11 / 19 / 33 / 42 / 53 / 91 / 100</div><p>DANTE // números documentados y trabajados explícitamente en 92–99</p><input id="danteNums" placeholder="ej. 1,2,3"><p>ALEPH/BORGES // hitos numéricos introducidos antes de COMEDIA como cierres o espejos del CTF</p><input id="alephNums" placeholder="ej. 4,5,6"><div class="row"><button onclick="solve100()">SEPARAR PATRÓN DE EVIDENCIA</button></div><div id="result" class="result"></div>`;scene(100)}
function nums(s){return [...new Set((s.match(/\d+/g)||[]).map(Number))].sort((a,b)=>a-b).join(',')}
function openFlag(key){return String.fromCharCode(...FLAG_C.map((v,i)=>v ^ key.charCodeAt(i%key.length)))}
async function solve100(){const d=nums(danteNums.value),a=nums(alephNums.value);if(await sha(d)!==DANTE_HASH||await sha(a)!==ALEPH_HASH){result.innerHTML='<span class="bad">La clasificación mezcla estructuras documentadas con la arquitectura del juego. Revisa la procedencia usada en este ejercicio.</span>';return}const key=d+'|'+a,flag=openFlag(key);try{localStorage.setItem('aleph_comedia_100','1')}catch(e){}result.innerHTML=`<div class="ok"><h2>${flag}</h2><p>DANTE → orden estructural.<br>MALLARMÉ → azar.<br>BORGES → totalidad.</p><button onclick="collapse100()">VER 100 PUNTOS</button></div><div class="external"><a href="https://dante.princeton.edu/cgi-bin/dante/DispToynbeeByTitOrId.pl?INP_ID=212131" target="_blank" rel="noopener">PRINCETON DANTE PROJECT ↗</a> <a href="https://worldofdante.org/" target="_blank" rel="noopener">WORLD OF DANTE ↗</a></div>`}
function collapse100(){const ov=document.createElement('div');ov.id='aleph-collapse';ov.innerHTML='<div class="aleph-core"><div class="aleph-core-number">100</div><div class="aleph-core-text">3 CANTICHE<br>34 + 33 + 33</div><div class="aleph-core-sub">ORDEN / AZAR / TOTALIDAD</div><button onclick="document.getElementById(\'aleph-collapse\').remove()">SALIR DE LA COMEDIA</button></div>';const groups=[34,33,33];let i=0;groups.forEach((count,g)=>{for(let j=0;j<count;j++){i++;const d=document.createElement('span');d.className='aleph-point';d.textContent=String(i).padStart(3,'0');const a=(j/count)*Math.PI*2+g*.7,r=11+g*10+(j%3)*1.4;d.style.setProperty('--x',(50+Math.cos(a)*r)+'vw');d.style.setProperty('--y',(50+Math.sin(a)*r*.62)+'vh');d.style.setProperty('--delay',(i*5)+'ms');ov.appendChild(d)}});document.body.appendChild(ov);window.dispatchEvent(new CustomEvent('aleph-collapse',{detail:{total:100}}));scene(100)}
isOpen().then(ok=>{if(ok)renderMap()});
</script>
