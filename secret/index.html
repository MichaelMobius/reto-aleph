const RSA_FLAG='814qXg8ShZHTYrFLfRRt3LUVPg==',FIB_FLAG='4q0W9DbJMwUZXWGzomxfanaBmV4=',PI_FLAG='g52iLhdCsBqgK7KOgc38iA==';
const CAT_FLAG='rmFXLasA12r+kS0EqxQ4U+c=',COL_FLAG='OxnYUmk9x+e8aotex3YLkfY=',GRAY_FLAG='GVQH20DvGgSel1AtCyW3vtwzgWaa',AUDIO_FLAG='Qjlgo1b3z9QPIiTrrVawpg0AvExFNTYurnuMQa6C4DZPMGChYw==',FINAL53_FLAG='ZXrxLAqVMrNkS4fzhWVsumacnMW840S/QTI=';
const FIB_SOLUTION_HASH='a3e153a47eb269405a1624fde6230d2c29b5ad236b3935cfa1e1bffe27664bf0',PI_SOLUTION_HASH='c2d1e77e5f39e053ff73fddcdef9c9f51f2bf6cb9cbf9ecc5d2c62f8d11feb73';
async function sha(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function xorOpen(b64,keyText){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(keyText)).then(buf=>{const key=new Uint8Array(buf),cipher=Uint8Array.from(atob(b64),x=>x.charCodeAt(0)),plain=cipher.map((x,i)=>x^key[i%key.length]);return new TextDecoder().decode(plain)})}
function isPrime(x){x=Number(x);if(!Number.isInteger(x)||x<2)return false;for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true}
function modPow(b,e,m){b=BigInt(b);e=BigInt(e);m=BigInt(m);let r=1n;while(e>0){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return Number(r)}
const HIDDEN_PROOF={"43":{"proofHash":"40b92853ceb79dfba8e726412d1a65a2bda6cee265ca49b2cd02408fa58322bf","markMask":125},"44":{"proofHash":"9861353bcbc857ffba687fba40d25f6c39ee8d57557fd798f3cf62548a65ec2b","markMask":136},"45":{"proofHash":"49725893509828a19938264e2a01b72af38d9d9b9e1af894389f3d3f6b1b4335","markMask":248},"46":{"proofHash":"cafa54dc364400cb4fb79c79d0104f6dba18ec58b7c3608610428baa7bbff464","markMask":34},"47":{"proofHash":"bb9ffaa2dd559698b586ea121310a425d78dc72b79c04e7fc4c15e15a1058caa","markMask":61},"48":{"proofHash":"c13f4bcbc2114ee26efa4ee47a40ab1e5686101d4046cd004d33ff158dd3ba4e","markMask":134},"49":{"proofHash":"5e710b02d6035b8d732025ff6ebc64d90afed9887e9a0af7fb9c60d97b0c67fd","markMask":233},"50":{"proofHash":"8ab40490833d24b6881e38251d4f8adb571025afbde7cecff359241d0e607c2d","markMask":10},"51":{"proofHash":"d003e0809ad36b9a0a6c750344f2a8aa0a8f39db7a8d670ff65e443840efd3a7","markMask":136},"52":{"proofHash":"a7eb13b580a583405e102e195b882d95ed0b9692b6c1f4126c714e35710eecb9","markMask":84}};
async function seal(n,keyText){const proof=await sha(`ALEPH53:${n}:${keyText}`),r=HIDDEN_PROOF[n];try{localStorage.setItem('aleph_hidden_'+n,proof)}catch(e){}const ch=String.fromCharCode(r.markMask ^ parseInt(proof.slice(0,2),16));return `<div class="terminal">INVISIBLE::${n} // mark=${ch}</div>`}
async function hiddenStatus(){let s='';for(let n=43;n<=52;n++){try{const proof=localStorage.getItem('aleph_hidden_'+n)||'',r=HIDDEN_PROOF[n];s+=/^[0-9a-f]{64}$/.test(proof)&&await sha(proof)===r.proofHash?String.fromCharCode(r.markMask ^ parseInt(proof.slice(0,2),16)):'?'}catch(e){s+='?'}}return s}
async function unlock(){const q=new URLSearchParams(location.search);const tests=[['step','STEP91_HASH',showStep19],['p','RSA_TOKEN_HASH',showRSA],['f','FIB_TOKEN_HASH',showFib],['pi','PI_TOKEN_HASH',showPi],['c','CAT_TOKEN_HASH',showCatalan],['x','COL_TOKEN_HASH',showCollatz],['b','POW_TOKEN_HASH',showHasard],['t','TRI_TOKEN_HASH',showSpectrum],['z','Z53_HASH',show53]];for(const [k,h,fn] of tests){const v=q.get(k)||'';if(v&&await sha(v)===H[h])return fn()}}
let branch7=false,branch13=false;
function showStep19(){document.title='46 · 19 ⇄ 91 — RETO ALEPH';document.body.classList.add('step19');document.getElementById('gate').innerHTML=`<div class="eyebrow">INVISIBLE::46 // PELDAÑO</div><h1 class="level mirror-title">19⇄91</h1><h2 class="title">El número atraviesa el espejo</h2><p class="lead">El 19 es primo. Reflejado deja de serlo. Factoriza 91.</p><div class="terminal">19 = PRIME\nMIRROR(19) = 91\n91 = a × b</div><div class="row"><input id="fa" inputmode="numeric" placeholder="a"><input id="fb" inputmode="numeric" placeholder="b"><button onclick="factorMirror()">FACTORIZAR</button></div><div id="result" class="result"></div><div id="mirrorBranches"></div>`}
async function factorMirror(){const a=+fa.value,b=+fb.value,p=[a,b].sort((x,y)=>x-y),out=document.getElementById('result');if(p[0]!==7||p[1]!==13){out.innerHTML='<span class="bad">La imagen no se descompone así.</span>';return}out.innerHTML='<div class="ok">91 = 7 × 13</div>'+await seal(46,'7X13');document.getElementById('mirrorBranches').innerHTML=`<div class="mirror-branches"><section class="branch-lock"><div class="eyebrow">INVISIBLE::47 // FACTOR 7</div><h2>7 ≠ estación</h2><p>Hay siete estructuras mayores. En sus routers aparece <code>axis.*</code>. Lee I→VII y convierte hexadecimal a ASCII.</p><div class="row"><input id="answer7" placeholder="7 caracteres"><button onclick="solveBranch7()">UNIR 7</button></div><div id="result7" class="result"></div></section><section class="branch-lock"><div class="eyebrow">INVISIBLE::48 // FACTOR 13</div><h2>13 = intersección</h2><p>Busca todas las estaciones ≤42 que son simultáneamente primas y Fibonacci. En sus fuentes aparece <code>junction.*</code>.</p><div class="row"><input id="answer13" placeholder="6 caracteres"><button onclick="solveBranch13()">UNIR 13</button></div><div id="result13" class="result"></div></section></div><div id="convergence"></div>`}
async function solveBranch7(){const w=(answer7.value||'').trim().toUpperCase(),o=result7;if(await sha(w)!==H.RING7_HASH){o.innerHTML='<span class="bad">Los siete anillos todavía no dicen eso.</span>';return}branch7=true;o.innerHTML='<span class="ok">AXIS::7 sincronizado.</span>'+await seal(47,w);checkConvergence()}
async function solveBranch13(){const w=(answer13.value||'').trim().toUpperCase(),o=result13;if(await sha(w)!==H.INTER13_HASH){o.innerHTML='<span class="bad">No has leído todas las intersecciones.</span>';return}branch13=true;o.innerHTML='<span class="ok">JUNCTION::13 sincronizada.</span>'+await seal(48,w);checkConvergence()}
function checkConvergence(){if(branch7&&branch13)convergence.innerHTML=`<div class="convergence"><div class="terminal">7 × 13 = 91\nCONVERGENCIA VISIBLE // 42 NODOS</div><button onclick="openAleph(42)">COLAPSAR LO VISIBLE</button><p class="lead">Pero lo visible quizá no sea todo el sistema.</p></div>`}
function openAleph(total=42){document.body.classList.add('aleph-open');const ov=document.createElement('div');ov.id='aleph-collapse';ov.innerHTML=`<div class="aleph-core"><div class="aleph-core-number">∞</div><div class="aleph-core-text">TODOS LOS PUNTOS<br>EN UN PUNTO</div><div class="aleph-core-sub">${total} nodos</div><button onclick="document.getElementById('aleph-collapse').remove();document.body.classList.remove('aleph-open')">CERRAR EL OJO</button></div>`;for(let i=1;i<=total;i++){const d=document.createElement('span');d.className='aleph-point';d.textContent=String(i).padStart(2,'0');const a=(i/total)*Math.PI*2,r=12+(i%7)*5;d.style.setProperty('--x',(50+Math.cos(a)*r)+'vw');d.style.setProperty('--y',(50+Math.sin(a)*r)+'vh');d.style.setProperty('--delay',(i*13)+'ms');ov.appendChild(d)}document.body.appendChild(ov);window.dispatchEvent(new CustomEvent('aleph-collapse',{detail:{total}}))}
function showRSA(){document.title='43 · RSA — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::43</div><h1 class="level">43</h1><h2 class="title">Dos primos custodian una puerta</h2><div class="terminal">public key: (n = 3233, e = 17)\nciphertext: [2933,1859,1486,3123,28]</div><p class="lead">Factoriza n, calcula φ(n), encuentra d y descifra a ASCII.</p><div class="row"><input id="rp" inputmode="numeric" placeholder="p"><input id="rq" inputmode="numeric" placeholder="q"></div><div class="row"><input id="rd" inputmode="numeric" placeholder="d"><button onclick="solveRSA()">DESCIFRAR</button></div><div id="result" class="result"></div>`}
async function solveRSA(){const p=+rp.value,q=+rq.value,d=+rd.value;if(!isPrime(p)||!isPrime(q)||p*q!==RSA_N){result.innerHTML='<span class="bad">p y q no factorizan n.</span>';return}const phi=(p-1)*(q-1);if((RSA_E*d)%phi!==1){result.innerHTML='<span class="bad">d no es el inverso modular.</span>';return}const text=String.fromCharCode(...RSA_C.map(c=>modPow(c,d,RSA_N))),flag=await xorOpen(RSA_FLAG,text);result.innerHTML=`<div class="ok">ASCII: <strong>${text}</strong><h2>${flag}</h2></div>`+await seal(43,text)}
function showFib(){document.title='44 · Fibonacci — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::44</div><h1 class="level">44 / F∞</h1><h2 class="title">Toda cifra es suma de conejos</h2><p class="lead">Zeckendorf: suma los Fibonacci marcados por cada bloque y convierte a ASCII.</p><div class="terminal">base=[89,55,34,21,13,8,5,3,2,1]\nblocks=[0101001001,0100010010,0100010100,0100010100,0100101000,0101010000]</div><div class="row"><input id="fibword" placeholder="palabra"><button onclick="solveFib()">VERIFICAR</button></div><div id="result" class="result"></div>`}
async function solveFib(){const w=(fibword.value||'').trim().toUpperCase();if(await sha(w)!==FIB_SOLUTION_HASH){result.innerHTML='<span class="bad">La palabra no coincide.</span>';return}result.innerHTML=`<h2>${await xorOpen(FIB_FLAG,w)}</h2>`+await seal(44,w)}
function showPi(){document.title='45 · π — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::45</div><h1 class="level">45 / π</h1><h2 class="title">La circunferencia también puede ser una llave</h2><div class="terminal">π stream=314159265358...\nkey bytes=31,41,59,26,53,58,...\nciphertext=[92,96,105,89,121,127]</div><p class="lead">XOR byte a byte.</p><div class="row"><input id="piword" placeholder="texto"><button onclick="solvePi()">VERIFICAR</button></div><div id="result" class="result"></div>`}
async function solvePi(){const w=(piword.value||'').trim().toUpperCase();if(await sha(w)!==PI_SOLUTION_HASH){result.innerHTML='<span class="bad">El texto no coincide.</span>';return}result.innerHTML=`<h2>${await xorOpen(PI_FLAG,w)}</h2>`+await seal(45,w)}
function showCatalan(){document.title='49 · Catalan — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::49</div><h1 class="level">49</h1><h2 class="title">42 también cuenta estructuras</h2><p class="lead">Los números de Catalan comienzan 1,1,2,5,14,42,... y cuentan, entre otras cosas, palabras de paréntesis balanceados. Si C₀=1, ¿qué índice n satisface Cₙ=42?</p><div class="row"><input id="catn" inputmode="numeric" placeholder="n"><button onclick="solveCatalan()">VERIFICAR</button></div><div id="result" class="result"></div>`}
async function solveCatalan(){const w=(catn.value||'').trim();if(await sha(w)!==H.CAT_SOL_HASH){result.innerHTML='<span class="bad">Ese índice no produce 42.</span>';return}result.innerHTML=`<h2>${await xorOpen(CAT_FLAG,w)}</h2>`+await seal(49,w)}
function showCollatz(){document.title='50 · Collatz — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::50</div><h1 class="level">50</h1><h2 class="title">Una órbita desde 13</h2><p class="lead">Aplica n/2 si n es par y 3n+1 si n es impar. Escribe la órbita completa desde 13 hasta 1, separada por comas.</p><div class="terminal">13 → ? → ? → ... → 1</div><div class="row"><input id="collatz" placeholder="13,40,...,1"><button onclick="solveCollatz()">VERIFICAR</button></div><div id="result" class="result"></div>`}
async function solveCollatz(){const w=(collatz.value||'').replace(/\s+/g,'');if(await sha(w)!==H.COL_SOL_HASH){result.innerHTML='<span class="bad">La órbita todavía se desvía.</span>';return}result.innerHTML=`<h2>${await xorOpen(COL_FLAG,w)}</h2>`+await seal(50,w)}
function showHasard(){document.title='51 · HASARD — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::51 // HASARD</div><h1 class="level">51</h1><h2 class="title">¿Es azar porque parece azar?</h2><p class="lead">El archivo contiene seis bloques de lanzamientos de dos dados ordenados. Si fueran justos, las 36 parejas deberían ser aproximadamente equiprobables. Busca la anomalía de cada bloque.</p><div class="external"><a href="../artifacts/coups_de_des.csv" download>DESCARGAR coups_de_des.csv ↓</a></div><div class="terminal">36 outcomes por bloque\nP(a,b) bajo H₀ = 1/36\nindex = 6(a−1)+(b−1)\nA=0,…,Z=25</div><p class="jodi-note">No busques un patrón en el orden de las filas. Cuenta. Compara. Pregunta qué tan compatible es lo observado con H₀.</p><div class="row"><input id="hasardword" placeholder="6 letras"><button onclick="solveHasard()">PROBAR HIPÓTESIS</button></div><div id="result" class="result"></div>`}
async function solveHasard(){const w=(hasardword.value||'').trim().toUpperCase();if(await sha(w)!==H.HASARD_SOL_HASH){result.innerHTML='<span class="bad">La distribución todavía no dice eso.</span>';return}result.innerHTML=`<div class="ok"><h2>HASARD</h2><p>La apariencia de ruido no garantiza aleatoriedad.</p></div>`+await seal(51,w)+`<div class="mallarme-field"><span style="left:4%;top:10%;font-size:12px">UN</span><span style="left:14%;top:35%;font-size:34px">COUP</span><span style="left:38%;top:18%;font-size:18px">DE</span><span style="left:55%;top:48%;font-size:52px">DÉS</span><span style="left:18%;top:72%;font-size:15px">JAMAIS</span><span style="left:46%;top:78%;font-size:27px">N'ABOLIRA</span><span style="left:76%;top:65%;font-size:18px">LE HASARD</span></div><div class="external"><a href="https://www.bnf.fr/fr/mediatheque/stephane-mallarme-jamais-un-coup-de-des-nabolira-le-hasard" target="_blank" rel="noopener">BnF // Mallarmé // 1897 ↗</a></div>`}
function showSpectrum(){document.title='52 · Espectro — RETO ALEPH';gate.innerHTML=`<div class="eyebrow">INVISIBLE::52 // SIGNAL</div><h1 class="level">52</h1><h2 class="title">No lo escuches solamente</h2><p class="lead">La secuencia triangular te trajo hasta aquí, pero el siguiente dato no vive en una suma. Descarga el archivo sonoro. Escucharlo no basta.</p><div class="terminal">signal-52.wav\nTIME ≠ WHOLE SIGNAL\n? = FREQUENCY × TIME</div><audio controls preload="metadata" style="width:100%;margin:18px 0"><source src="../artifacts/signal-52.wav" type="audio/wav"></audio><div class="external"><a href="../artifacts/signal-52.wav" download>DESCARGAR signal-52.wav ↓</a></div><p class="jodi-note">PISTA // Una forma de onda responde “cuándo”. Busca una representación que también responda “a qué frecuencia”.</p><div class="row"><input id="spectrumword" placeholder="palabra oculta" autocomplete="off"><button onclick="solveSpectrum()">LEER SEÑAL</button></div><div id="result" class="result"></div>`}
async function solveSpectrum(){const w=(spectrumword.value||'').trim().toUpperCase();if(await sha(w)!==H.AUDIO_SOL_HASH){result.innerHTML='<span class="bad">Eso no es lo que dibuja la señal.</span>';return}result.innerHTML=`<h2>${await xorOpen(AUDIO_FLAG,w)}</h2>`+await seal(52,w)+`<p class="lead">Diez estaciones invisibles ya pueden formar una frase. La undécima no pertenece al intervalo visible.</p>`}
async function show53(){document.title='53 · CAMPO PRIMO — RETO ALEPH';const s=await hiddenStatus(),ok=s==='POINTFIELD';gate.innerHTML=`<div class="eyebrow">INVISIBLE::53 // META</div><h1 class="level">53</h1><h2 class="title">El primer cierre también es primo</h2><div class="terminal">visible=42\ninvisible_1=11\nprimer_cierre=53\nseals[43..52]=${s}</div>${ok?`<p class="lead">Ahora 53 deja de ser conteo y se convierte en módulo. En F₅₃, descifra y=(17x+9) mod 53. Usa A=0,...,Z=25. Ciphertext:</p><div class="terminal">35 18 24 52 35 39 18 14</div><p class="lead">Encuentra 17⁻¹ mod 53 y recupera los ocho valores x.</p><div class="row"><input id="fieldword" placeholder="8 letras"><button onclick="solve53()">ABRIR 53</button></div><div id="result" class="result"></div>`:`<p class="lead">Esta estación sabe que existen diez invisibles anteriores, pero tu navegador solo conserva ${s.replace(/[^?]/g,'•').split('').filter(c=>c==='•').length}/10.</p><p>Resuelve 43–52 en este navegador. Cada una entrega una marca.</p>`}`}
async function solve53(){const w=(fieldword.value||'').trim().toUpperCase();if(await sha(w)!==H.FINAL53_SOL_HASH){result.innerHTML='<span class="bad">El campo no devuelve ese punto.</span>';return}const flag=await xorOpen(FINAL53_FLAG,w);const proof=await sha(`ALEPH53:53:${w}`);try{localStorage.setItem('aleph_codex_open',proof)}catch(e){}result.innerHTML=`<div class="ok"><h2>${flag}</h2><p>53 = 42 visibles + 11 invisibles: primer cierre primo.</p><button onclick="openAleph(53)">VER LOS 53 PUNTOS</button> <a class="btn" href="../codex/">ENTRAR AL CODEX 54→91</a></div>`}
unlock();
</script><script type="module" src="../assets/aleph3d.js"></script></body></html>
